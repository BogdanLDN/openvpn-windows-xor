# The name of our workflow
name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # run at 2 AM UTC

jobs:
  msvc:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, amd64]

    env:
      CMAKE: cmake.exe
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      OSSL: ossl3
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}\openvpn-build\windows-msi\vcpkg-ports
      WIX: ${{ github.workspace }}\wix\

    name: 'openvpn-build'
    runs-on: windows-2022

    steps:
      - name: Get date
        run: |
          $date = Get-Date -Format "ddMMyyyy"
          echo "DATE=${date}" >> $Env:GITHUB_ENV

      - name: Checkout openvpn-build
        uses: actions/checkout@v4
        with:
          path: openvpn-build

      - name: Checkout openvpn
        uses: actions/checkout@v4
        with:
          repository: openvpn/openvpn
          ref: v2.5.7
          path: openvpn
      
      - name: Copy TunnelBlick patches
        run: cp ${{ github.workspace }}\openvpn-build\tunnelblick-patches\* ${{ github.workspace }}\openvpn\
      
      - name: Apply TunnelBlick patch A
        run: cd ${{ github.workspace }}\openvpn\ && git apply --ignore-whitespace -v 02-tunnelblick-openvpn_xorpatch-a.diff
      - name: Apply TunnelBlick patch B
        run: cd ${{ github.workspace }}\openvpn\ && git apply --ignore-whitespace -v 03-tunnelblick-openvpn_xorpatch-b.diff
      - name: Apply TunnelBlick patch C
        run: cd ${{ github.workspace }}\openvpn\ && git apply --ignore-whitespace -v 04-tunnelblick-openvpn_xorpatch-c.diff
      - name: Apply TunnelBlick patch D
        run: cd ${{ github.workspace }}\openvpn\ && git apply --ignore-whitespace -v 05-tunnelblick-openvpn_xorpatch-d.diff
      - name: Apply TunnelBlick patch E
        run: cd ${{ github.workspace }}\openvpn\ && git apply --ignore-whitespace -v 06-tunnelblick-openvpn_xorpatch-e.diff

      - name: Checkout openvpn-gui
        uses: actions/checkout@v4
        with:
          repository: openvpn/openvpn-gui
          path: openvpn-gui

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 0

      - name: Get latest CMake and ninja
        uses: lukka/get-cmake@latest

      - name: Install rst2html
        run: python -m pip install --upgrade pip rst2html

      - name: Setup MSVC prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Wix 3.14
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile wix.zip
          Expand-Archive -Path .\wix.zip -DestinationPath wix\bin

      - name: Disable SpectreMitigation in openvpn vcxproj (Spectre libs not on runner)
        run: |
          Get-ChildItem ${{ github.workspace }}\openvpn -Recurse -Filter *.vcxproj | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            if ($c -match 'SpectreMitigation') {
              ($c -replace '<SpectreMitigation>[^<]*</SpectreMitigation>','<SpectreMitigation>false</SpectreMitigation>') | Set-Content $_.FullName -NoNewline
              Write-Host "patched $($_.Name)"
            }
          }

      - name: Add vcpkg builtin-baseline to openvpn-gui manifest (newer vcpkg requires it)
        run: |
          $sha = (git -C "${{ github.workspace }}\vcpkg" rev-parse HEAD).Trim()
          $path = "${{ github.workspace }}\openvpn-gui\vcpkg.json"
          $j = Get-Content $path -Raw | ConvertFrom-Json
          $j | Add-Member -NotePropertyName 'builtin-baseline' -NotePropertyValue $sha -Force
          ($j | ConvertTo-Json -Depth 10) | Set-Content $path -Encoding ascii
          Write-Host "patched openvpn-gui/vcpkg.json builtin-baseline = $sha"
          Get-Content $path

      - name: Build
        working-directory: openvpn-build/windows-msi
        run: |
          New-Item -Name build-and-package-env.ps1 -ItemType File
          ./build-and-package.ps1 -basedir ../.. -ossl ossl3 -nosign -arch ${{ matrix.arch }} -nodevprompt

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-master-${{ matrix.arch }}-${{ env.DATE }}
          path: ${{ github.workspace }}\openvpn-build\windows-msi\image\*-${{ matrix.arch }}.msi
